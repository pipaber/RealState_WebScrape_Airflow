<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relación entre espacio, alquiler y profundidad de mercado</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #fff; }
    header { margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 40px); line-height: 1.08; }
    .subtitle { margin: 8px 0 0; color: #526176; }
    .facets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 28px; }
    .facet { min-width: 0; }
    .facet h2 { margin: 0 0 4px; font-size: 18px; }
    svg { display: block; width: 100%; height: auto; overflow: visible; }
    .axis text { fill: #526176; font-size: 11px; }
    .axis path, .axis line { stroke: #cbd5e1; }
    .grid line { stroke: #e2e8f0; }
    .grid path { display: none; }
    .point { cursor: pointer; stroke: #334155; stroke-width: 0.8; opacity: 0.88; }
    .point.active { stroke: #111827; stroke-width: 3; opacity: 1; }
    .direct-label { fill: #334155; font-size: 10px; pointer-events: none; }
    .legend-row { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; margin-top: 16px; color: #526176; font-size: 12px; }
    .legend-group { display: flex; align-items: center; gap: 8px; }
    .gradient { width: 190px; height: 12px; background: linear-gradient(90deg, #440154, #31688e, #35b779, #fde725); border: 1px solid #cbd5e1; }
    .bubble-key { display: inline-flex; align-items: center; gap: 5px; }
    .bubble { display: inline-block; border-radius: 50%; background: #94a3b8; border: 1px solid #334155; }
    .detail { margin: 16px 0 0; padding: 11px 14px; background: #f8fafc; border-left: 4px solid #2a788e; color: #334155; }
    .tooltip { position: fixed; pointer-events: none; visibility: hidden; z-index: 10; background: #172033; color: #fff; padding: 8px 10px; border-radius: 6px; font-size: 12px; box-shadow: 0 8px 24px rgba(15, 23, 42, .22); }
    footer { margin-top: 18px; color: #64748b; font-size: 12px; }
    @media (max-width: 900px) { body { padding: 16px; } .facets { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Relación entre espacio, alquiler y profundidad de mercado</h1>
    <p class="subtitle" id="subtitle"></p>
  </header>
  <main class="facets" id="facets"></main>
  <div class="legend-row" aria-label="Leyendas">
    <div class="legend-group"><span>Precio mediano por m²</span><span id="color-min"></span><span class="gradient"></span><span id="color-max"></span></div>
    <div class="legend-group"><span>Tamaño de burbuja</span><span class="bubble-key"><span class="bubble" style="width:12px;height:12px"></span>5</span><span class="bubble-key"><span class="bubble" style="width:19px;height:19px"></span>20</span><span class="bubble-key"><span class="bubble" style="width:27px;height:27px"></span>50 avisos</span></div>
  </div>
  <p class="detail" id="detail" aria-live="polite"></p>
  <div class="tooltip" id="tooltip"></div>
  <footer>Fuente exclusiva: Gold market_daily_by_district · Moneda PEN · Distritos validados con límites IGN/IDEP</footer>

  <script>
    const data = __VALUE_MATRIX_DATA__;
    const rows = data.rows;
    const formatInteger = d3.format(",.0f");
    const formatOne = d3.format(".1f");
    const formatCurrency = value => `S/ ${d3.format(",.0f")(value)}`;
    const areaExtent = d3.extent(rows, row => row.avg_area_m2);
    const rentExtent = d3.extent(rows, row => row.median_price);
    const priceM2Extent = d3.extent(rows, row => row.median_price_per_m2);
    const supplyExtent = d3.extent(rows, row => row.listing_count);
    const xDomain = [Math.max(1, areaExtent[0] * 0.78), areaExtent[1] * 1.12];
    const yDomain = [Math.max(100, rentExtent[0] * 0.72), rentExtent[1] * 1.18];
    const color = d3.scaleSequential(d3.interpolateViridis).domain(priceM2Extent);
    const radius = d3.scaleSqrt().domain([0, supplyExtent[1]]).range([4, 14]);
    const tooltip = d3.select("#tooltip");
    const detail = d3.select("#detail");

    d3.select("#subtitle").text(`Scrape: ${data.scrapeDate} · X = área promedio · Y = alquiler mediano · Color = precio por m² · Burbuja = avisos`);
    d3.select("#color-min").text(formatCurrency(priceM2Extent[0]));
    d3.select("#color-max").text(formatCurrency(priceM2Extent[1]));

    function weightedMean(items, field) {
      return d3.sum(items, row => row[field] * row.listing_count) / d3.sum(items, row => row.listing_count);
    }

    function selectRow(row) {
      d3.selectAll(".point").classed("active", item => item.district_key === row.district_key && item.bedrooms === row.bedrooms);
      detail.text(`${row.district} · ${row.bedrooms} cuarto${row.bedrooms > 1 ? "s" : ""} · ${formatInteger(row.listing_count)} avisos · ${formatOne(row.avg_area_m2)} m² · ${formatCurrency(row.median_price)} alquiler mediano · ${formatCurrency(row.median_price_per_m2)}/m²`);
    }

    function showTooltip(event, row) {
      tooltip
        .style("visibility", "visible")
        .style("left", `${Math.min(event.clientX + 14, window.innerWidth - 245)}px`)
        .style("top", `${Math.max(10, event.clientY - 42)}px`)
        .html(`<strong>${row.district}</strong><br>${row.bedrooms} cuarto${row.bedrooms > 1 ? "s" : ""}<br>${formatInteger(row.listing_count)} avisos<br>${formatOne(row.avg_area_m2)} m² promedio<br>${formatCurrency(row.median_price)} alquiler mediano<br>${formatCurrency(row.median_price_per_m2)}/m²`);
    }

    const facets = d3.select("#facets");
    for (const bedrooms of [1, 2, 3, 4]) {
      const subset = rows.filter(row => row.bedrooms === bedrooms);
      const section = facets.append("section").attr("class", "facet");
      section.append("h2").text(`${bedrooms} cuarto${bedrooms > 1 ? "s" : ""} · ${formatInteger(d3.sum(subset, row => row.listing_count))} avisos`);
      const svg = section.append("svg")
        .attr("viewBox", "0 0 640 390")
        .attr("role", "img")
        .attr("aria-label", `Relación entre área, alquiler y precio por metro cuadrado para ${bedrooms} cuartos`);
      svg.append("title").text(`Matriz de valor para ${bedrooms} cuartos`);
      const margin = {top: 12, right: 20, bottom: 54, left: 74};
      const width = 640 - margin.left - margin.right;
      const height = 390 - margin.top - margin.bottom;
      const group = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
      const x = d3.scaleLog().domain(xDomain).range([0, width]);
      const y = d3.scaleLog().domain(yDomain).range([height, 0]);
      const xTicks = [25, 40, 60, 80, 120, 180, 260, 340].filter(value => value >= xDomain[0] && value <= xDomain[1]);
      const yTicks = [500, 1000, 2000, 4000, 8000, 12000].filter(value => value >= yDomain[0] && value <= yDomain[1]);
      group.append("g").attr("class", "grid").attr("transform", `translate(0,${height})`).call(d3.axisBottom(x).tickValues(xTicks).tickSize(-height).tickFormat(""));
      group.append("g").attr("class", "grid").call(d3.axisLeft(y).tickValues(yTicks).tickSize(-width).tickFormat(""));
      group.append("line").attr("x1", x(weightedMean(subset, "avg_area_m2"))).attr("x2", x(weightedMean(subset, "avg_area_m2"))).attr("y1", 0).attr("y2", height).attr("stroke", "#94a3b8").attr("stroke-dasharray", "5,4");
      group.append("line").attr("x1", 0).attr("x2", width).attr("y1", y(weightedMean(subset, "median_price"))).attr("y2", y(weightedMean(subset, "median_price"))).attr("stroke", "#94a3b8").attr("stroke-dasharray", "5,4");
      group.append("g").attr("class", "axis").attr("transform", `translate(0,${height})`).call(d3.axisBottom(x).tickValues(xTicks).tickFormat(d3.format("~g")));
      group.append("g").attr("class", "axis").call(d3.axisLeft(y).tickValues(yTicks).tickFormat(value => `S/ ${value / 1000}k`));
      svg.append("text").attr("x", margin.left + width / 2).attr("y", 382).attr("text-anchor", "middle").attr("fill", "#526176").attr("font-size", 12).text("Área promedio (m², escala log)");
      svg.append("text").attr("transform", "rotate(-90)").attr("x", -(margin.top + height / 2)).attr("y", 15).attr("text-anchor", "middle").attr("fill", "#526176").attr("font-size", 12).text("Alquiler mediano (PEN, escala log)");

      const points = group.selectAll("circle")
        .data(subset)
        .join("circle")
        .attr("class", "point")
        .attr("cx", row => x(row.avg_area_m2))
        .attr("cy", row => y(row.median_price))
        .attr("r", row => radius(row.listing_count))
        .attr("fill", row => color(row.median_price_per_m2))
        .on("mouseenter", (event, row) => { selectRow(row); showTooltip(event, row); })
        .on("mousemove", (event, row) => showTooltip(event, row))
        .on("mouseleave", () => tooltip.style("visibility", "hidden"))
        .on("click", (_event, row) => selectRow(row));

      const labels = [...new Map([
        ...[...subset].sort((a, b) => d3.descending(a.listing_count, b.listing_count)).slice(0, 3),
        ...[...subset].sort((a, b) => d3.descending(a.median_price, b.median_price)).slice(0, 1)
      ].map(row => [row.district_key, row])).values()];
      group.selectAll(".direct-label")
        .data(labels)
        .join("text")
        .attr("class", "direct-label")
        .attr("x", row => x(row.avg_area_m2) + 7)
        .attr("y", row => y(row.median_price) - 7)
        .text(row => row.district);
    }

    const defaultRow = [...rows].sort((a, b) => d3.descending(a.listing_count, b.listing_count))[0];
    if (defaultRow) selectRow(defaultRow);
  </script>
</body>
</html>
