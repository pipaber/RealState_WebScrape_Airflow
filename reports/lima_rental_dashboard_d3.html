      const key = datum?.district_key ?? datum?.properties?.district_key ?? datum?.data?.district_key;
      return marketByKey.get(key);

      if (!row) return;
      tooltip
        .style("visibility", "visible")
        .style("left", `${Math.min(event.clientX + 14, window.innerWidth - 230)}px`)
        .style("top", `${Math.max(10, event.clientY - 34)}px`)
        .html(`<strong>${row.district}</strong><br>${formatInteger(row.listing_count)} avisos<br>${formatCurrency(row.avg_rent_pen)} alquiler promedio<br>${formatCurrency(row.median_price)} alquiler mediano<br>${d3.format(".1f")(row.avg_area_m2)} m² promedio<br>${formatCurrency(row.median_price_m2)}/m²`);
    }

    function hideTooltip() { tooltip.style("visibility", "hidden"); }

    function setActive(key) {
      d3.selectAll(".district-mark").classed("active", datum => {
        const row = rowForDatum(datum);
        return row?.district_key === key;
      });
      const row = marketByKey.get(key);
      if (!row) return;
      const mix = bedroomRows.filter(item => item.district_key === key);
      const mixText = mix.length
        ? " · " + mix.sort((a, b) => a.bedrooms - b.bedrooms)
            .map(item => `${item.bedrooms} cuarto${item.bedrooms > 1 ? "s" : ""}: ${formatInteger(item.listing_count)}`)

    const ox = d3.scaleLinear().domain([0, d3.max(market, row => row.listing_count) * 1.12]).range([0, ow]);

    opportunityGroup.append("g").attr("class", "grid").attr("transform", `translate(0,${oh})`).call(d3.axisBottom(ox).ticks(6).tickSize(-oh).tickFormat(""));
    opportunityGroup.append("g").attr("class", "grid").call(d3.axisLeft(oy).ticks(6).tickSize(-ow).tickFormat(""));
    opportunityGroup.append("line").attr("x1", ox(supplyMedian)).attr("x2", ox(supplyMedian)).attr("y1", 0).attr("y2", oh).attr("stroke", "#64748b").attr("stroke-dasharray", "5,4");
    opportunityGroup.append("line").attr("x1", 0).attr("x2", ow).attr("y1", oy(rentMedian)).attr("y2", oy(rentMedian)).attr("stroke", "#64748b").attr("stroke-dasharray", "5,4");
    opportunityGroup.append("g").attr("class", "axis").attr("transform", `translate(0,${oh})`).call(d3.axisBottom(ox).ticks(6));
    opportunityGroup.append("g").attr("class", "axis").call(d3.axisLeft(oy).ticks(6).tickFormat(value => `S/ ${(value / 1000).toFixed(1)}k`));
    opportunitySvg.append("text").attr("x", om.left + ow / 2).attr("y", 342).attr("text-anchor", "middle").attr("fill", "#526176").attr("font-size", 12).text("Oferta disponible (avisos)");
    opportunitySvg.append("text").attr("transform", "rotate(-90)").attr("x", -(om.top + oh / 2)).attr("y", 15).attr("text-anchor", "middle").attr("fill", "#526176").attr("font-size", 12).text("Alquiler promedio");
    opportunityGroup.append("text").attr("x", ow - 4).attr("y", 16).attr("text-anchor", "end").attr("fill", "#1e3a8a").attr("font-size", 11).text("Prioridad: oferta + ticket altos");
    const opportunityPoints = opportunityGroup.selectAll("circle")
      .data(market)
      .join("circle")
      .attr("class", "district-mark")
      .attr("cx", row => ox(row.listing_count))
      .attr("cy", row => oy(row.avg_rent_pen))
      .attr("r", 6)
      .attr("fill", row => data.rentColors[row.rent_bracket])
      .attr("stroke", "#334155").attr("stroke-width", 0.8);
    bindInteraction(opportunityPoints, datum => datum);

    const opportunityLabels = market
      .filter(row => row.listing_count >= supplyMedian && row.avg_rent_pen >= rentMedian)
      .sort((a, b) => d3.descending(a.listing_count * a.avg_rent_pen, b.listing_count * b.avg_rent_pen))
      .slice(0, 5);
    opportunityGroup.selectAll(".point-label")
      .data(opportunityLabels)
      .join("text")
      .attr("class", "point-label")
      .attr("x", row => ox(row.listing_count) + 7)
      .attr("y", row => oy(row.avg_rent_pen) - 7)
      .attr("font-size", 10).attr("fill", "#334155")
      .text(row => row.district);

    // Supply ranking, stacked by bedrooms when available
    const rankingData = [...market].sort((a, b) => d3.descending(a.listing_count, b.listing_count)).slice(0, 10);
    const rankingSvg = d3.select("#ranking");
    const rm = {top: 10, right: 118, bottom: 38, left: 132};
    const rw = 560 - rm.left - rm.right;
    const rh = 460 - rm.top - rm.bottom;
    const rankingGroup = rankingSvg.append("g").attr("transform", `translate(${rm.left},${rm.top})`);
    const rx = d3.scaleLinear().domain([0, d3.max(rankingData, row => row.listing_count)]).range([0, rw]);
    const ry = d3.scaleBand().domain(rankingData.map(row => row.district_key)).range([0, rh]).padding(0.22);
    rankingGroup.append("g").attr("class", "grid").attr("transform", `translate(0,${rh})`).call(d3.axisBottom(rx).ticks(5).tickSize(-rh).tickFormat(""));
    rankingGroup.append("g").attr("class", "axis").call(d3.axisLeft(ry).tickFormat(key => marketByKey.get(key).district));
    rankingGroup.append("g").attr("class", "axis").attr("transform", `translate(0,${rh})`).call(d3.axisBottom(rx).ticks(5));

    if (bedroomRows.length) {
      d3.select("#ranking-title").text("Oferta por distrito y número de cuartos");
      d3.select("#ranking-note").text("Longitud total = avisos · segmentos = 1, 2, 3 y 4 cuartos");
      const byDistrict = d3.group(bedroomRows, row => row.district_key);
      const stackedRows = rankingData.map(row => {
        const result = {district_key: row.district_key};
        const mix = byDistrict.get(row.district_key) || [];
        for (const bedrooms of [1, 2, 3, 4]) {
          result[String(bedrooms)] = d3.sum(mix.filter(item => item.bedrooms === bedrooms), item => item.listing_count);
        }
        return result;
      });
      const stack = d3.stack().keys(["1", "2", "3", "4"])(stackedRows);
      const segments = rankingGroup.selectAll(".bedroom-series")
        .data(stack)
        .join("g")
        .attr("fill", series => data.bedroomColors[series.key])
        .selectAll("rect")
        .data(series => series.map(item => ({...item, bedrooms: Number(series.key), district_key: item.data.district_key})))
        .join("rect")
        .attr("class", "district-mark")
        .attr("x", item => rx(item[0]))
        .attr("y", item => ry(item.district_key))
        .attr("width", item => Math.max(0, rx(item[1]) - rx(item[0])))
        .attr("height", ry.bandwidth())
        .attr("stroke", "#ffffff").attr("stroke-width", 0.7);
      bindInteraction(segments);
      const bedroomLegend = d3.select("#bedroom-legend");
      [1, 2, 3, 4].forEach(bedrooms => {
        const item = bedroomLegend.append("span").attr("class", "legend-item");
        item.append("span").attr("class", "swatch").style("background", data.bedroomColors[String(bedrooms)]);
        item.append("span").text(`${bedrooms} cuarto${bedrooms > 1 ? "s" : ""}`);
      });
    } else {
      d3.select("#ranking-title").text("Dónde se concentra la oferta");
      d3.select("#ranking-note").text("El CSV actual no incluye bedrooms; usa 04_visualization_export.sql");
      const bars = rankingGroup.selectAll("rect.offer")
        .data(rankingData)
        .join("rect")
        .attr("class", "offer district-mark")
        .attr("x", 0).attr("y", row => ry(row.district_key))
        .attr("width", row => rx(row.listing_count)).attr("height", ry.bandwidth())
        .attr("fill", row => data.rentColors[row.rent_bracket]);
      bindInteraction(bars, datum => datum);
    }
    rankingGroup.selectAll(".bar-label")
      .data(rankingData)
      .join("text")
      .attr("class", "bar-label")
      .attr("x", row => rx(row.listing_count) + 6)
      .attr("y", row => ry(row.district_key) + ry.bandwidth() / 2)
      .attr("dominant-baseline", "middle")
      .attr("font-size", 10).attr("fill", "#526176")
      .text(row => `${formatInteger(row.listing_count)} · ${formatCurrency(row.avg_rent_pen)} prom.`);

    const defaultDistrict = opportunityLabels[0] || rankingData[0];
    if (defaultDistrict) setActive(defaultDistrict.district_key);
  </script>
</body>
</html>
